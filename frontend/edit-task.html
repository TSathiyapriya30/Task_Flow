<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Task - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="dashboard.html"><span class="brand-icon">&#9989;</span> TaskFlow</a>
      <div class="navbar-actions">
        <span class="nav-user">Hi, <span data-user-name>there</span></span>
        <a class="btn btn-secondary" href="#" data-logout>Logout</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Edit Task</h1>
      <a class="btn btn-secondary" href="dashboard.html">&larr; Back to Dashboard</a>
    </div>

    <div class="card-form">
      <div id="form-alert" class="alert"></div>

      <form id="edit-task-form" novalidate>
        <div class="form-group">
          <label for="title">Title</label>
          <input class="form-control" type="text" id="title" name="title" maxlength="150" required />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea class="form-control" id="description" name="description" maxlength="2000"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="status">Status</label>
            <select class="form-control" id="status" name="status">
              <option value="PENDING">Pending</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select class="form-control" id="priority" name="priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="dueDate">Due Date</label>
          <input class="form-control" type="date" id="dueDate" name="dueDate" />
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="submit-btn">Save Changes</button>
          <a class="btn btn-secondary" href="dashboard.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/task.js"></script>
</body>
</html>
