<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="dashboard.html"><span class="brand-icon">&#9989;</span> TaskFlow</a>
      <div class="navbar-actions">
        <span class="nav-user">Hi, <span data-user-name>there</span></span>
        <a class="btn btn-secondary" href="#" data-logout>Logout</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>My Tasks</h1>
      <a class="btn btn-primary" href="create-task.html">+ New Task</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card progress">
        <div class="stat-value" id="stat-progress">0</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="Search tasks by title or description..." />
      <select id="status-filter">
        <option value="">All Statuses</option>
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
      </select>
      <select id="priority-filter">
        <option value="">All Priorities</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>
      <select id="sort-select">
        <option value="createdAt:desc">Newest First</option>
        <option value="createdAt:asc">Oldest First</option>
        <option value="dueDate:asc">Due Date (Earliest)</option>
        <option value="dueDate:desc">Due Date (Latest)</option>
        <option value="title:asc">Title (A-Z)</option>
        <option value="priority:desc">Priority (High-Low)</option>
      </select>
    </div>

    <div id="task-list" class="task-list">
      <div class="loading">Loading tasks...</div>
    </div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <h3>Delete this task?</h3>
      <p>This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancel-delete">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
